name: Generate Snake Animation

on:
  schedule:
    # Chạy tự động mỗi ngày lúc 00:00 UTC (~07:00 sáng giờ Việt Nam)
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # cho phép bấm "Run workflow" chạy tay
  push:
    branches:
      - main              # tự chạy lại mỗi khi bạn push code lên nhánh main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: diggoryQH
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
